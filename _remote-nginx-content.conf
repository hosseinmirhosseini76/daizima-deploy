# Content Platform — content.daizima.com → PM2 :3024
#
# Install (after DNS A/Proxied for content.daizima.com):
#   sudo cp deploy/_remote-nginx-content.conf /etc/nginx/sites-available/daizima-content
#   sudo ln -sfn /etc/nginx/sites-available/daizima-content /etc/nginx/sites-enabled/daizima-content
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL: reuse apex Cloudflare Origin CA (SAN includes *.daizima.com).
# PM2 app must listen on 127.0.0.1:3024 (GitHub Actions → apps=content).

server {
    listen 80;
    server_name content.daizima.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name content.daizima.com;

    ssl_certificate     /etc/letsencrypt/live/daizima.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daizima.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    rewrite ^/(.*)/$ /$1 permanent;

    location = /api {
        return 301 /;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    location ^~ /storage/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        expires 30d;
    }

    location / {
        proxy_pass http://127.0.0.1:3024;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
