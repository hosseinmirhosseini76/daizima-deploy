# Daizima frontend — HTTP redirect + HTTPS origin (self-signed / Origin CA / LE)
# Compatible with Cloudflare SSL mode: Full (upgrade to Full Strict with Origin CA or LE)

# HTTP → HTTPS (Cloudflare Full uses 443; Torob/bots may hit :80)
server {
    listen 80;
    server_name daizima.com www.daizima.com 185.18.212.24;
    rewrite ^/(.*)/$ https://$host/$1 permanent;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name daizima.com www.daizima.com;

    ssl_certificate     /etc/letsencrypt/live/daizima.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daizima.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;


    # Canonical: /path/ → /path (301); root "/" unchanged; query string preserved
    rewrite ^/(.*)/$ /$1 permanent;

    # Sitemap — serve XML directly from Laravel (reliable for Googlebot; no Nuxt hop)
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8100/api/v1/seo/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_buffering off;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Sitemap children — serve generated XML from Laravel without a Nuxt hop.
    location ~ ^/sitemaps/(pages|categories|brands|blogs|products-[1-9][0-9]*)\.xml$ {
        rewrite ^/sitemaps/(.+)\.xml$ /api/v1/seo/sitemaps/$1.xml break;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_buffering off;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Proxy to Nuxt SSR server (PM2)
    # Check PM2 port with: pm2 list or pm2 info daizima-frontend
    location / {
        proxy_pass http://localhost:3000;  # Change port if PM2 uses different port
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Disable proxy buffering to prevent corruption
        proxy_buffering off;
        proxy_request_buffering off;

        # Cache headers - allow caching but require revalidation after deploy
        # must-revalidate ensures cache is checked after PM2 restart
        # Browser and proxy caches will be used for performance, but will revalidate after deploy
        add_header Cache-Control "public, must-revalidate, max-age=600" always;

        # Optional: Enable proxy cache (requires proxy_cache_path in nginx.conf http block)
        # Uncomment these lines if you added proxy_cache_path to nginx.conf:
        # proxy_cache daizima_cache;
        # proxy_cache_key "$scheme$request_method$host$request_uri";
        # proxy_cache_valid 200 10m;
        # proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        # proxy_cache_background_update on;
        # proxy_cache_lock on;
        # add_header X-Cache-Status $upstream_cache_status always;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # PWA — never cache service worker or manifest
    location ~* ^/(sw\.js|workbox-.*\.js|manifest\.webmanifest)$ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # JavaScript assets — compression handled by Nitro upstream (Phase 3: U+001F fixed via icon subset)
    location ~* \.js$ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_request_buffering off;
        add_header Content-Type "application/javascript; charset=utf-8" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Serve builds metadata (JSON files) - CRITICAL for Nuxt HMR and chunk loading
    location /_nuxt/builds/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        
        # Disable buffering
        proxy_buffering off;
        proxy_request_buffering off;

        # Don't cache metadata files - they change frequently
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Serve all _nuxt assets (JS, CSS, JSON, images, fonts) - CRITICAL for Nuxt to work
    location /_nuxt/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_request_buffering off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 1y;
    }

    # Cache other static assets (images, fonts) with shorter cache
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Shorter cache for non-hashed assets
        add_header Cache-Control "public, max-age=2592000" always;
        expires 30d;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;

        # CORS headers (if needed)
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # Torob Product API v3 + price feed (must reach Laravel, not Nuxt)
    location /torob_api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    # Torob order tracking API
    location /torob/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    # Emalls product list feed (must reach Laravel, not Nuxt / blog legacy redirect)
    location = /list {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    location /emalls/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    # WebSocket proxy (if using WebSocket)
    location /ws {
        proxy_pass http://localhost:6001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;

        # WebSocket timeouts
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
    }

    # Proxy storage to Laravel container (static files with long cache)
    location ^~ /storage/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        expires 30d;
    }

    # Static assets are handled by Nuxt SSR server
    # No need for separate location blocks when using reverse proxy

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression (JS served pre-compressed by Nitro when compressPublicAssets is enabled)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        text/javascript
        application/xml+rss
        image/svg+xml;
}
