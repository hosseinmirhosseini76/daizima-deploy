# Phase 1 — admin + user only
# Keep the existing daizima.com vhost pointing at the OLD Nuxt (`127.0.0.1:3000`).
# Install these extra server blocks; do NOT replace the live apex config yet.
#
# One-time:
#   1) DNS A records: admin.daizima.com, user.daizima.com (Cloudflare Proxied)
#   2) SSL certs covering those hosts (wildcard Origin cert or Let's Encrypt).
#      If Cloudflare Origin is already used on apex, reuse that same cert path.
#   3) Copy deploy/_remote-nginx-apex-bridge.inc onto the server and include it
#      inside the EXISTING daizima.com HTTPS server (keep / → :3000).
#   4) Copy this file into sites-available and enable it
#   5) nginx -t && systemctl reload nginx
#
# Full storefront cutover later: use `_remote-nginx-multi-app.conf` (apex → :3021)

# ---------------------------------------------------------------------------
# HTTP → HTTPS for the new hosts
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name admin.daizima.com user.daizima.com;
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
# ADMIN (admin.daizima.com) → PM2 :3022
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name admin.daizima.com;

    # Live origin cert is Cloudflare Origin CA (SAN: daizima.com + *.daizima.com)
    # at the apex path. Do not point at live/admin.daizima.com — that dir does not exist.
    ssl_certificate     /etc/letsencrypt/live/daizima.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daizima.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    rewrite ^/(.*)/$ /$1 permanent;

    location ^~ /panel/ {
        rewrite ^/panel/(.*)$ /$1 permanent;
    }
    location = /panel {
        return 301 /dashboard;
    }

    location = /api {
        return 301 /;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    location ^~ /storage/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        expires 30d;
    }

    # Laravel Reverb (Docker host port 6101 → container 6001). Strip /ws prefix.
    location /ws/ {
        proxy_pass http://127.0.0.1:6101/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3022;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# ---------------------------------------------------------------------------
# USER (user.daizima.com) → PM2 :3023
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name user.daizima.com;

    ssl_certificate     /etc/letsencrypt/live/daizima.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daizima.com/privkey.pem;
