# mail.daizima.com — OBSOLETE (2026-11-03)
#
# We do not run mail/webmail. DNS for mail was caused by Cloudflare wildcard
# A `*.daizima.com` (plus MX → mail.daizima.com). That made browsers/Google hit
# this host with a cert that only covers apex/www/admin/user/content → HTTPS errors.
#
# Fix applied: deleted wildcard A + MX; SPF set to `v=spf1 -all`; nginx mail
# vhost disabled on the VPS. Do NOT re-enable this file unless you intentionally
# restore mail DNS and add mail.daizima.com to the Let's Encrypt SAN list.
#
# If you ever need a temporary redirect again (only after mail is in the cert):
#   return 301 https://daizima.com$request_uri;
