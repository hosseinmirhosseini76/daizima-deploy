# mail.daizima.com — redirect to storefront; never serve admin (default SSL vhost).
#
# Root cause: Host mail.daizima.com had no server_name match, so nginx used the
# first listen 443 block (admin.daizima.com → :3022) and served the admin SPA.
#
# Product decision: no webmail on this host — always send browsers to daizima.com.
#
# Install:
#   sudo cp deploy/_remote-nginx-mail.conf /etc/nginx/sites-available/daizima-mail
#   sudo ln -sfn /etc/nginx/sites-available/daizima-mail /etc/nginx/sites-enabled/daizima-mail
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL: reuse apex Cloudflare Origin CA (SAN includes *.daizima.com).

server {
    listen 80;
    server_name mail.daizima.com;
    return 301 https://daizima.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mail.daizima.com;

    ssl_certificate     /etc/letsencrypt/live/daizima.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daizima.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    return 301 https://daizima.com$request_uri;
}
