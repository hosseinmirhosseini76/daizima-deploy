# Daizima — three Nuxt apps + shared API proxy
# Domains: daizima.com (storefront), admin.daizima.com, user.daizima.com
# Compatible with Cloudflare SSL Full / Full Strict
#
# PM2 process ports (adjust if different):
#   storefront → 127.0.0.1:3021
#   admin      → 127.0.0.1:3022
#   user       → 127.0.0.1:3023
# Laravel API  → 127.0.0.1:8100
# WebSocket    → 127.0.0.1:6001

# ---------------------------------------------------------------------------
# HTTP → HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name daizima.com www.daizima.com admin.daizima.com user.daizima.com;
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
# Shared snippet macros as repeated location blocks (nginx include-friendly)
# Each vhost below proxies /api and /storage to Laravel same-origin.
# ---------------------------------------------------------------------------

# ===================== STOREFRONT (daizima.com) =====================
server {
    listen 443 ssl http2;
    server_name daizima.com www.daizima.com;

    ssl_certificate     /etc/letsencrypt/live/daizima.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daizima.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    rewrite ^/(.*)/$ /$1 permanent;

    # Legacy panel → new admin subdomain
    location ^~ /panel {
        return 301 https://admin.daizima.com$request_uri;
    }

    # Legacy user-panel → new user subdomain (strip /user-panel prefix)
    location = /user-panel {
        return 301 https://user.daizima.com/;
    }
    location ^~ /user-panel/ {
        rewrite ^/user-panel/(.*)$ https://user.daizima.com/$1 permanent;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8100/api/v1/seo/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_buffering off;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location ~ ^/sitemaps/(pages|categories|brands|blogs|products-[1-9][0-9]*)\.xml$ {
        rewrite ^/sitemaps/(.+)\.xml$ /api/v1/seo/sitemaps/$1.xml break;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_buffering off;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Exact /api is not a page. Without this, nginx 301s /api → /api/ and the
    # trailing-slash strip sends /api/ → /api (browser loop + GSC Redirect error).
    location = /api {
        return 301 /;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    location ^~ /storage/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        expires 30d;
    }

    location /torob_api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    location /torob/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    location = /list {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    location /emalls/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    location /ws {
        proxy_pass http://127.0.0.1:6001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
        add_header Cache-Control "public, must-revalidate, max-age=600" always;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript text/javascript application/xml+rss image/svg+xml;
}

# ===================== ADMIN (admin.daizima.com) =====================
server {
    listen 443 ssl http2;
    server_name admin.daizima.com;

    ssl_certificate     /etc/letsencrypt/live/daizima.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daizima.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    rewrite ^/(.*)/$ /$1 permanent;

    # Rewrite legacy /panel/* bookmarks that land on admin host
    location ^~ /panel/ {
        rewrite ^/panel/(.*)$ /$1 permanent;
    }
    location = /panel {
        return 301 /dashboard;
    }

    # Exact /api is not a page. Without this, nginx 301s /api → /api/ and the
    # trailing-slash strip sends /api/ → /api (browser loop + GSC Redirect error).
    location = /api {
        return 301 /;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    location ^~ /storage/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        expires 30d;
    }

    location /ws {
        proxy_pass http://127.0.0.1:6001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3022;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}

